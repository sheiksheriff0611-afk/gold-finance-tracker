services:
  # 1. Django Backend Web Service
  - type: web
    name: gold-finance-backend
    runtime: python
    buildCommand: "cd backend && pip install -r requirements.txt && python manage.py collectstatic --no-input && python manage.py migrate && python seed_data.py"
    startCommand: "cd backend && gunicorn gold_tracker.wsgi:application"
    plan: free
    region: oregon
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: gold-finance-db
          property: connectionString

  # 2. React Frontend Static Site
  - type: static
    name: gold-finance-frontend
    buildCommand: "cd frontend && npm install && npm run build"
    staticPublishPath: "./frontend/dist"
    plan: free
    region: oregon
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: gold-finance-backend
          property: host
    routes:
      - type: rewrite
        source: "/*"
        destination: "/index.html"

databases:
  # 3. Managed PostgreSQL Database
  - name: gold-finance-db
    plan: free
    region: oregon
